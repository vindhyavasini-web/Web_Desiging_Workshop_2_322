<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <section class="todo-panel" aria-labelledby="appTitle">
      <header class="app-header">
        <p class="eyebrow">Daily planner</p>
        <h1 id="appTitle">To-Do List</h1>
        <p class="subtitle">Keep track of your tasks and finish the day with a clean slate.</p>
      </header>

      <form class="task-form" id="taskForm">
        <label class="sr-only" for="taskInput">New task</label>
        <input id="taskInput" type="text" placeholder="Add a new task..." autocomplete="off" />
        <button type="submit">Add</button>
      </form>

      <div class="toolbar" aria-label="Task filters">
        <button class="filter active" type="button" data-filter="all">All</button>
        <button class="filter" type="button" data-filter="active">Active</button>
        <button class="filter" type="button" data-filter="completed">Done</button>
      </div>

      <ul class="task-list" id="taskList" aria-live="polite"></ul>

      <footer class="summary">
        <span id="taskCount">0 tasks left</span>
        <button class="clear-btn" id="clearCompleted" type="button">Clear done</button>
      </footer>
    </section>
  </main>

  <template id="taskTemplate">
    <li class="task-item">
      <label class="task-check">
        <input type="checkbox" />
        <span></span>
      </label>
      <span class="task-title"></span>
      <button class="delete-btn" type="button" aria-label="Delete task">Delete</button>
    </li>
  </template>

  <script src="script.js"></script>
</body>
</html>
