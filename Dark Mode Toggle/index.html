<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dark Mode Toggle</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f1e8;
      --surface: #ffffff;
      --text: #1f2933;
      --muted: #667085;
      --accent: #147d64;
      --accent-strong: #0d5e4a;
      --sky-top: #82c7eb;
      --sky-bottom: #f8d48b;
      --hill-front: #2f9461;
      --hill-back: #6dbf72;
      --shadow: rgba(20, 29, 38, 0.16);
      --switch-bg: #cde8f8;
      --switch-knob: #ffd166;
      --switch-border: rgba(31, 41, 51, 0.14);
    }

    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #11161d;
      --surface: #1b2430;
      --text: #f3f7fb;
      --muted: #a9b4c2;
      --accent: #5ee0b7;
      --accent-strong: #92f2d1;
      --sky-top: #101827;
      --sky-bottom: #303b63;
      --hill-front: #182b2f;
      --hill-back: #223c43;
      --shadow: rgba(0, 0, 0, 0.42);
      --switch-bg: #253047;
      --switch-knob: #dbe8ff;
      --switch-border: rgba(255, 255, 255, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 12% 18%, rgba(20, 125, 100, 0.13), transparent 28%),
        linear-gradient(135deg, var(--bg), var(--surface));
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      transition: background 500ms ease, color 300ms ease;
    }

    .app {
      width: min(92vw, 820px);
      min-height: min(76vh, 620px);
      display: grid;
      grid-template-rows: 1fr auto;
      gap: 28px;
      padding: clamp(18px, 4vw, 36px);
    }

    .scene {
      position: relative;
      min-height: 390px;
      overflow: hidden;
      border: 1px solid var(--switch-border);
      border-radius: 8px;
      background: linear-gradient(180deg, var(--sky-top), var(--sky-bottom));
      box-shadow: 0 24px 70px var(--shadow);
      transition: background 500ms ease, border-color 300ms ease, box-shadow 300ms ease;
    }

    .stars {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 450ms ease;
    }

    .stars span {
      position: absolute;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 12px #ffffff;
    }

    .stars span:nth-child(1) { left: 18%; top: 22%; }
    .stars span:nth-child(2) { left: 33%; top: 13%; }
    .stars span:nth-child(3) { left: 48%; top: 28%; }
    .stars span:nth-child(4) { left: 69%; top: 17%; }
    .stars span:nth-child(5) { left: 82%; top: 33%; }
    .stars span:nth-child(6) { left: 58%; top: 9%; }

    [data-theme="dark"] .stars {
      opacity: 1;
    }

    .sun-moon {
      position: absolute;
      left: 11%;
      top: 14%;
      width: 112px;
      height: 112px;
      border-radius: 50%;
      background: var(--switch-knob);
      box-shadow: 0 0 42px rgba(255, 209, 102, 0.62);
      transition: transform 650ms cubic-bezier(.22, 1, .36, 1), background 300ms ease, box-shadow 300ms ease;
    }

    .sun-moon::after {
      content: "";
      position: absolute;
      width: 88px;
      height: 88px;
      right: -12px;
      top: -8px;
      border-radius: 50%;
      background: var(--sky-top);
      opacity: 0;
      transition: opacity 350ms ease;
    }

    [data-theme="dark"] .sun-moon {
      transform: translate(520px, 26px);
      box-shadow: 0 0 38px rgba(219, 232, 255, 0.34);
    }

    [data-theme="dark"] .sun-moon::after {
      opacity: 1;
    }

    .cloud {
      position: absolute;
      width: 152px;
      height: 48px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.78);
      transition: opacity 400ms ease, transform 500ms ease;
    }

    .cloud::before,
    .cloud::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: inherit;
    }

    .cloud::before {
      left: 26px;
      top: -30px;
      width: 70px;
      height: 70px;
    }

    .cloud::after {
      right: 24px;
      top: -20px;
      width: 58px;
      height: 58px;
    }

    .cloud.one {
      right: 10%;
      top: 22%;
    }

    .cloud.two {
      left: 12%;
      top: 43%;
      transform: scale(0.72);
    }

    [data-theme="dark"] .cloud {
      opacity: 0.08;
      transform: translateY(26px);
    }

    [data-theme="dark"] .cloud.two {
      transform: scale(0.72) translateY(26px);
    }

    .hill {
      position: absolute;
      left: 50%;
      bottom: -150px;
      width: 780px;
      height: 320px;
      border-radius: 50%;
      transform: translateX(-50%);
      background: var(--hill-back);
      transition: background 400ms ease;
    }

    .hill.front {
      bottom: -205px;
      width: 900px;
      height: 390px;
      background: var(--hill-front);
    }

    .content {
      position: absolute;
      left: clamp(18px, 6vw, 58px);
      right: clamp(18px, 6vw, 58px);
      bottom: clamp(24px, 7vw, 62px);
      max-width: 520px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2.4rem, 8vw, 5.8rem);
      line-height: 0.9;
      letter-spacing: 0;
    }

    p {
      max-width: 45ch;
      margin: 0;
      color: var(--muted);
      font-size: clamp(1rem, 2.3vw, 1.15rem);
      line-height: 1.65;
      transition: color 300ms ease;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 0 0;
    }

    .mode-label {
      min-width: 0;
    }

    .mode-label strong {
      display: block;
      font-size: 1.08rem;
    }

    .mode-label span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.94rem;
    }

    .toggle {
      width: 116px;
      height: 58px;
      flex: 0 0 auto;
      padding: 5px;
      border: 1px solid var(--switch-border);
      border-radius: 999px;
      background: var(--switch-bg);
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.11), 0 12px 26px var(--shadow);
      cursor: pointer;
      transition: background 300ms ease, border-color 300ms ease, box-shadow 300ms ease;
    }

    .toggle:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 5px;
    }

    .knob {
      position: relative;
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: var(--switch-knob);
      color: #334155;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.22);
      transform: translateX(0);
      transition: transform 300ms ease, background 300ms ease, color 300ms ease;
    }

    [data-theme="dark"] .knob {
      color: #f8fafc;
      transform: translateX(58px);
    }

    .icon {
      position: absolute;
      width: 22px;
      height: 22px;
      transition: opacity 220ms ease, transform 260ms ease;
    }

    .icon.sun {
      opacity: 1;
    }

    .icon.moon {
      opacity: 0;
      transform: rotate(-30deg) scale(0.75);
    }

    [data-theme="dark"] .icon.sun {
      opacity: 0;
      transform: rotate(30deg) scale(0.75);
    }

    [data-theme="dark"] .icon.moon {
      opacity: 1;
      transform: rotate(0) scale(1);
    }

    @media (max-width: 640px) {
      body {
        overflow: auto;
      }

      .app {
        min-height: 100vh;
        width: min(100%, 440px);
      }

      .scene {
        min-height: 430px;
      }

      [data-theme="dark"] .sun-moon {
        transform: translate(180px, 38px);
      }

      .controls {
        align-items: flex-start;
      }

      .toggle {
        width: 104px;
        height: 54px;
      }

      .knob {
        width: 42px;
        height: 42px;
      }

      [data-theme="dark"] .knob {
        transform: translateX(50px);
      }
    }
  </style>
</head>
<body>
  <main class="app" aria-label="Dark mode toggle demo">
    <section class="scene" aria-hidden="true">
      <div class="stars">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </div>
      <div class="sun-moon"></div>
      <div class="cloud one"></div>
      <div class="cloud two"></div>
      <div class="hill"></div>
      <div class="hill front"></div>
      <div class="content">
        <h1 id="headline">Light mode</h1>
        <p id="description">Tap the switch to move the page from a bright daytime scene into a calm dark mode.</p>
      </div>
    </section>

    <section class="controls" aria-label="Theme controls">
      <div class="mode-label">
        <strong id="modeText">Light theme</strong>
        <span>Saved automatically on this browser.</span>
      </div>

      <button class="toggle" id="themeToggle" type="button" role="switch" aria-checked="false" aria-label="Switch to dark mode">
        <span class="knob" aria-hidden="true">
          <svg class="icon sun" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="4.5" fill="currentColor"></circle>
            <path d="M12 2.5v3M12 18.5v3M21.5 12h-3M5.5 12h-3M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1M18.7 18.7l-2.1-2.1M7.4 7.4 5.3 5.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
          </svg>
          <svg class="icon moon" viewBox="0 0 24 24" fill="none">
            <path d="M20.4 14.9A8.5 8.5 0 0 1 9.1 3.6 8.5 8.5 0 1 0 20.4 14.9Z" fill="currentColor"></path>
          </svg>
        </span>
      </button>
    </section>
  </main>

  <script>
    const root = document.documentElement;
    const toggle = document.querySelector("#themeToggle");
    const headline = document.querySelector("#headline");
    const description = document.querySelector("#description");
    const modeText = document.querySelector("#modeText");
    const storedTheme = localStorage.getItem("theme");
    const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;

    function setTheme(theme) {
      const isDark = theme === "dark";

      root.dataset.theme = theme;
      toggle.setAttribute("aria-checked", String(isDark));
      toggle.setAttribute("aria-label", isDark ? "Switch to light mode" : "Switch to dark mode");
      headline.textContent = isDark ? "Dark mode" : "Light mode";
      description.textContent = isDark
        ? "The lights are low, the colors are softer, and your preference is saved for next time."
        : "Tap the switch to move the page from a bright daytime scene into a calm dark mode.";
      modeText.textContent = isDark ? "Dark theme" : "Light theme";
      localStorage.setItem("theme", theme);
    }

    setTheme(storedTheme || (prefersDark ? "dark" : "light"));

    toggle.addEventListener("click", () => {
      const nextTheme = root.dataset.theme === "dark" ? "light" : "dark";
      setTheme(nextTheme);
    });
  </script>
</body>
</html>
